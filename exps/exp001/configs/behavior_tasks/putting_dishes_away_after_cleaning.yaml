env:
  _target_: capx.envs.tasks.r1pro.r1pro_behavior.R1ProBehaviorCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.r1pro_b1k.R1ProBehaviourLowLevel
      controller_cfg: /home/group_9fce22/user_00003_9fce22/geniac_prize_2026/exps/exp001/configs/behavior_controllers/putting_dishes_away_after_cleaning.yaml
      activity_name: putting_dishes_away_after_cleaning
    privileged: false
    apis:
    - R1ProControlApi
    prompt: |
      You are controlling a R1Pro robot with the API described below.
      Goal: Put the dishes away after cleaning.
      Write executable Python code only. Import libraries explicitly when needed.
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Consider querying the environment state through perception-based tool calls and prints to see if the task is completed.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete
api_servers:
- _target_: capx.serving.launch_sam3_server.main
  device: cuda
  port: 8114
  host: 127.0.0.1
- _target_: capx.serving.launch_contact_graspnet_server.main
  port: 8115
  host: 127.0.0.1
record_video: true
use_parallel_ensemble: true
use_multimodel: false
output_dir: ./outputs/putting_dishes_away_after_cleaning
use_img_differencing: true
trials: 19
num_workers: 1
resume_idx: 0
save_multiturn_prompts: true
use_oracle_code: false
