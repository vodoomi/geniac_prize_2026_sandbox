validation_policy:
  seen: development_task_idsのタスクを、開発と重ならない初期状態で評価。
  unseen: validation_task_idsを全初期状態について開発から隔離し、固定した評価状態で評価。対象はLIBEROとBEHAVIORのみで、Robosuiteの未知タスク検証は行わない。
  metrics:
  - 環境別・seen/unseen別の成功率
  - タスク平均・グループ平均の成功率
  - 実行時間・失敗の内訳
  comparison: 変更前後は同じタスク・初期状態・step上限・時間予算。エージェントの入力にseed・正解状態・成功フラグを混ぜない。
  failures: 実行不能・欠損を成功率の分母から黙って除かない。インフラ障害とエージェント失敗を別記する。
